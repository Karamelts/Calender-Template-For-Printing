<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026年11月 – 2027年4月 日历（A4）</title>
<style>
  @page {
    size: A4 portrait;
    margin: 0;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    background: #eceff1;
    color: #000;
    font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* ---------- 工具栏（打印时隐藏） ---------- */
  .toolbar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    padding: 18px 12px;
  }

  .btn {
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    padding: 11px 34px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: #fff;
    cursor: pointer;
    transition: background .15s;
  }
  .btn:hover  { background: #1d4ed8; }
  .btn:active { transform: translateY(1px); }

  .hint {
    font-size: 13px;
    color: #78909c;
  }

  /* ---------- A4 页面 ---------- */
  .page {
    width: 210mm;
    height: 296.5mm;
    padding: 8mm;
    margin: 0 auto 30px;
    background: #fff;
    box-shadow: 0 2px 18px rgba(0, 0, 0, .18);
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: repeat(3, 1fr);
    gap: 4mm;
  }

  /* ---------- 单个月份 ---------- */
  .month {
    display: flex;
    flex-direction: column;
    min-height: 0;
    border: 0.35mm solid #111;
    overflow: hidden;
    break-inside: avoid;
  }

  .m-title {
    height: 6mm;
    line-height: 6mm;
    text-align: center;
    font-size: 9pt;
    font-weight: 700;
    letter-spacing: .08em;
    border-bottom: 0.3mm solid #111;
  }

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    height: 4mm;
    background: #f1f1f1;
    border-bottom: 0.3mm solid #111;
  }
  .weekdays span {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 6pt;
    font-weight: 700;
    color: #333;
  }
  .weekdays span:first-child,
  .weekdays span:last-child { color: #b3261e; }

  /* ---------- 日期格 ---------- */
  .days {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: repeat(6, 1fr);
  }

  .day {
    position: relative;
    min-height: 0;
    padding: 0.4mm 0.6mm;
    border-right: 0.2mm solid #c9c9c9;
    border-bottom: 0.2mm solid #c9c9c9;
    overflow: hidden;
  }
  .day:nth-child(7n)     { border-right: none; }
  .day:nth-child(n + 36) { border-bottom: none; }

  .day .n {
    display: block;
    font-size: 6.5pt;
    font-weight: 600;
    line-height: 1.15;
    color: #000;
  }
  .day.weekend .n { color: #b3261e; }
  .day.pad       { background: #fafafa; }

  /* ---------- 打印 ---------- */
  @media print {
    body { background: #fff; }
    .toolbar { display: none !important; }
    .page {
      margin: 0;
      box-shadow: none;
      height: 296.5mm;
    }
  }
</style>
</head>
<body>

  <div class="toolbar">
    <button class="btn" id="printBtn">🖨 打印 A4</button>
    <span class="hint">打印设置：纸张 A4 · 缩放 100% · 边距「无」</span>
  </div>

  <div class="page" id="page"></div>

<script>
(function () {
  /* 要生成的月份：年, 月(0 起) */
  var MONTHS = [
    [2026, 10],  // 2026年11月
    [2026, 11],  // 2026年12月
    [2027, 0],   // 2027年1月
    [2027, 1],   // 2027年2月
    [2027, 2],   // 2027年3月
    [2027, 3]    // 2027年4月
  ];

  var WEEK_LABELS = ['日', '一', '二', '三', '四', '五', '六'];
  var ROWS = 6;                       // 每个月固定 6 行，保证所有格子一样大
  var pageEl = document.getElementById('page');

  MONTHS.forEach(function (ym) {
    var y = ym[0], m = ym[1];

    var firstWeekday = new Date(y, m, 1).getDay();      // 0 = 周日
    var daysInMonth  = new Date(y, m + 1, 0).getDate(); // 当月天数

    /* --- 月份容器 --- */
    var monthEl = document.createElement('section');
    monthEl.className = 'month';

    /* --- 标题 --- */
    var titleEl = document.createElement('div');
    titleEl.className = 'm-title';
    titleEl.textContent = y + '年' + (m + 1) + '月';
    monthEl.appendChild(titleEl);

    /* --- 星期表头 --- */
    var wdEl = document.createElement('div');
    wdEl.className = 'weekdays';
    WEEK_LABELS.forEach(function (w) {
      var s = document.createElement('span');
      s.textContent = w;
      wdEl.appendChild(s);
    });
    monthEl.appendChild(wdEl);

    /* --- 日期格 --- */
    var daysEl = document.createElement('div');
    daysEl.className = 'days';

    var totalCells = ROWS * 7;
    for (var i = 0; i < totalCells; i++) {
      var col = i % 7;
      var dayNum = i - firstWeekday + 1;

      var cell = document.createElement('div');
      cell.className = 'day';
      if (col === 0 || col === 6) cell.classList.add('weekend');

      if (dayNum >= 1 && dayNum <= daysInMonth) {
        var numEl = document.createElement('span');
        numEl.className = 'n';
        numEl.textContent = dayNum;
        cell.appendChild(numEl);
      } else {
        cell.classList.add('pad');   // 上/下月空位
      }

      daysEl.appendChild(cell);
    }

    monthEl.appendChild(daysEl);
    pageEl.appendChild(monthEl);
  });

  /* --- 打印按钮 --- */
  document.getElementById('printBtn').addEventListener('click', function () {
    window.print();
  });
})();
</script>
</body>
</html>
